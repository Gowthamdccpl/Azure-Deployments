b374b731-f0fa-4775-91a9-f0193ab42ce3=// Listener for ESignTxnCompleted_MoveIn\r\ndocument.addEventListener('ESignTxnCompleted_MoveIn', () \=> {\r\n    const autoAdvanceButtonMoveIn \= document.querySelector("[data-button-id*\='AutoAdvance_To_Nexttask_MoveIn']");\r\n    const autoAdvanceButtonMoveInReset \= document.querySelector("[data-button-id*\='MoveIn_Reset']");\r\n    const showProcessTimerButtonMoveIn \= document.querySelector("[data-button-id*\='Show_ProcessTimer_MoveIn']");\r\n    if (autoAdvanceButtonMoveIn) {\r\n        autoAdvanceButtonMoveIn.click();\r\n        console.info("ESignTxnCompleted_MoveIn event handler executed\: AutoAdvance_To_Nexttask_MoveIn button clicked.");\r\n    } else {\r\n        console.warn("ESignTxnCompleted_MoveIn event handler\: AutoAdvance_To_Nexttask_MoveIn button not found.");\r\n    }\r\n\r\n    if (autoAdvanceButtonMoveInReset) {\r\n        autoAdvanceButtonMoveInReset.click();\r\n        console.info("ESignTxnCompleted_MoveIn event handler executed\: MoveIn_Reset button clicked.");\r\n    } else {\r\n        console.warn("ESignTxnCompleted_MoveIn event handler\: MoveIn_Reset button not found.");\r\n    }\r\n\r\n    if (showProcessTimerButtonMoveIn) {\r\n        showProcessTimerButtonMoveIn.click();\r\n        console.log("ESignTxnCompleted_MoveIn event handler\: Show_ProcessTimer_MoveIn button clicked.");\r\n    } else {\r\n        console.warn("ESignTxnCompleted_MoveIn event handler\: Show_ProcessTimer_MoveIn button not found.");\r\n    }\r\n});\r\n\r\n// Listener for ESignTxnCompleted_Move\r\ndocument.addEventListener('ESignTxnCompleted_MoveStd', () \=> {\r\n    const autoAdvanceButtonMove \= document.querySelector("[data-button-id*\='AutoAdvance_To_EprocedureHome']");\r\n    const showProcessTimerButtonMove \= document.querySelector("[data-button-id*\='Show_ProcessTimer_Move']");\r\n    if (autoAdvanceButtonMove) {\r\n        autoAdvanceButtonMove.click();\r\n        console.info("ESignTxnCompleted_Move event handler exe