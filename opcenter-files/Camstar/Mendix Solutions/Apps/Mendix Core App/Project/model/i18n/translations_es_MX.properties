e58d9fed-3881-4fd6-bf13-cd868fdcc7f6=setTimeout(() \=> {\r\n  const chooseFileButton \= document.getElementsByClassName("mx-fileinput-upload-button")[0];\r\n  chooseFileButton.innerHTML \= "Choose File";\r\n  chooseFileButton.setAttribute("tabindex", -1);\r\n\r\n  chooseFileButton.addEventListener("focus", (evt) \=> {\r\n     chooseFileButton.blur();\r\n  });\r\n\r\n const fileNameInput \= document.querySelector(".mx-compound-control .form-control");\r\n\r\nfileNameInput.value\="";\r\nfileNameInput.setAttribute("tabindex", -1);\r\n\r\n document.clickListener \= document.querySelector(".mx-compound-control").addEventListener("click",  (event) \=> {\r\n      if (\!event.target.classList.contains('mx-fileinput-upload-button')) {\r\n            chooseFileButton.click();\r\n      }\r\n  });\r\n\r\n const parentControl \= document.querySelector(".layout-upload-container");\r\n\r\n  function handleEnterKey(event) {\r\n    if (event.key \=\=\= 'Enter') {\r\n     chooseFileButton.click();\r\n    }\r\n  }\r\n\r\n  parentControl.addEventListener('keydown', handleEnterKey);\r\n}, 100);
