689f34bd-6b7b-42b8-8c25-a946ab9c756f=El IDP de SAML aplicar\u00e1 la (re)autenticaci\u00f3n de los usuarios finales, incluso si ya han iniciado sesi\u00f3n en el IdP de SAML. Marque esta casilla solo si una mayor seguridad para su aplicaci\u00f3n es m\u00e1s importante que la comodidad de tener un inicio de sesi\u00f3n \u00fanico para sus usuarios finales.
