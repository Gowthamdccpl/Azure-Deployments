ff8b81c2-a29d-4ff8-99e4-2e164a461c5a=La autenticaci\u00f3n debe comenzar en esta aplicaci\u00f3n, que genera un ID. La respuesta autenticada debe coincidir con este Id generado. Si no se encuentra ninguna petici\u00f3n que concuerde con el Id de respuesta, se rechaza la informaci\u00f3n. \r\nSi su IdP puede iniciar una nueva transacci\u00f3n (con un nuevo Id o sin \u00e9l) y desea permitirlo, puede marcar esta casilla. \r\nEvite esta opci\u00f3n ya que se considera menos segura.
