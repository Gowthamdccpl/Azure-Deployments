4cbf5c8d-eea5-49ee-9339-fb547bfd6e09=Al marcar la casilla, se ejecutar\u00e1 el microflujo "CustomAfterSigninLogic". Puede cambiar el microflujo predeterminado proporcionando su propio microflujo personalizado a continuaci\u00f3n. Este microflujo se ejecuta tras crear la nueva sesi\u00f3n y permite copiar o revisar datos de la sesi\u00f3n original (an\u00f3nima) en la sesi\u00f3n o el usuario reci\u00e9n creados. Esta funcionalidad es similar al microflujo "Despu\u00e9s del inicio de sesi\u00f3n" que se encuentra en la seguridad del proyecto Mendix.
