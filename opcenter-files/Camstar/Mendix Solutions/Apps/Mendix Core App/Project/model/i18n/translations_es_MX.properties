2ff4d4f2-8257-4d49-8669-4de97e1bd3b0=ReadMe\r\n\=\=\=\=\=\=\=\r\n\r\nC\u00f3mo configurar\r\n----------------------------------------\r\n\r\nNo modifique este m\u00f3dulo, en su lugar\:\r\n\r\n1. En la configuraci\u00f3n de la aplicaci\u00f3n (Configuraciones de Ajustes > de aplicaciones > constantes), establezca el valor de la constante 'EncryptionKey' en una cadena de 32 caracteres. Esta clave se utilizar\u00e1 para el cifrado y descifrado.\r\n2. Cree un nuevo m\u00f3dulo llamado 'EncryptionCustomizations'.\r\n3. Agregue p\u00e1ginas nuevas a este m\u00f3dulo, reutilice fragmentos del m\u00f3dulo 'Cifrado'. \r\n    Las p\u00e1ginas del m\u00f3dulo 'Cifrado' se pueden utilizar como ejemplos.\r\n4. Crear microflujos nuevos para reemplazar los microflujos que abren formularios. Se pueden reutilizar los microflujos gen\u00e9ricos.
