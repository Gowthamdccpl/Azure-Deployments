ed44476b-ee6d-41ed-bdb7-23a21db68707=Migre las clases de contexto de autenticaci\u00f3n configuradas a continuaci\u00f3n a la nueva configuraci\u00f3n que considera las prioridades de las clases de contexto de autenticaci\u00f3n. Estas se implementaron para mayor cumplimiento con la especificaci\u00f3n SAML 2.0 (consulte\: https\://www.oasis-open.org/committees/download.php/35711/sstc-saml-core-errata-2.0-wd-06-diff.pdf). Tras la migraci\u00f3n, esta subsecci\u00f3n desaparecer\u00e1 autom\u00e1ticamente. Tenga en cuenta que esta migraci\u00f3n NO es opcional.
