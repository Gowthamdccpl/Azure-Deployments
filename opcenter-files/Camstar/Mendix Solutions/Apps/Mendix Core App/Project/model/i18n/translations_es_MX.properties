66692f06-4e63-4166-ae11-467807ddcee8=El m\u00f3dulo EXCR_Authentication se conecta a un servidor instalado con Opcenter EXCR (con los servicios REST habilitados) para autenticar y configurar una sesi\u00f3n de transacci\u00f3n v\u00e1lida.
fe4fd73f-a1f6-49a0-b6b8-f364d9331d80=
abb2dc83-52a1-4255-8df9-aa8120894519=A continuaci\u00f3n se muestran los pasos de configuraci\u00f3n necesarios para permitir que el m\u00f3dulo de autenticaci\u00f3n se ejecute correctamente.
25a1d6c7-37d8-42b1-b48a-d7dacba1d5ec=
3344f3a5-39dc-4c3f-9b98-4a4365b10c65=1. Configurar EXCR_Authentication.ServerURL
fdd346ba-64af-4f38-8f9a-647b80ad54bb=
d34cfbbe-ef2b-4d82-87a1-e465953bf2ff=a. Acceda al m\u00f3dulo EXCR_Showcase.\r\nb. Edite la constante ServerURL con una entrada con el siguiente formato\: https\://<nombredelservidor>
a26c5cc4-318e-4aac-a5ea-c84213023f5e=
16444e29-52cb-4a69-b439-e4fd647652eb=2. Importe el certificado SSL que se export\u00f3 desde el servidor fijado en la constante anterior.
e1c4eb97-ef98-47d7-b860-a297d1c8f26e=
65ce44a5-b37e-4f0d-9bb1-cd59fb8aa6e0=a. Exportar el certificado del servidor destino.\r\nb. En Studio Pro, vaya a Ajustes de la soluci\u00f3n.\r\nc. Seleccione la pesta\u00f1a Certificados.\r\nd. Haga clic en el bot\u00f3n Importar, navegue hasta donde est\u00e1 guardado su certificado y luego haga clic en Abrir.
3c8165f8-76e1-408f-8307-3faac2ba8fe4=
1fc013e0-193d-4373-bb45-ffacd861e986=Uso del token de API de REST
3af7d367-7652-40f6-a225-b882173a71b0=Las llamadas REST al servidor de Opcenter requieren una URL de servidor y un token de autenticaci\u00f3n. Al iniciar la sesi\u00f3n mediante el m\u00f3dulo Autenticaci\u00f3n, el valor simb\u00f3lico al portador y la direcci\u00f3n URL se actualizan en el objeto de configuraci\u00f3n del usuario que inici\u00f3 la sesi\u00f3n.
b69cbd33-cef3-4a13-ac92-c6eae0b587cb=
74873bc3-f51b-490b-a6c8-868bc4c23112=1. Antes de la acci\u00f3n de REST de llamada, agregue una acci\u00f3n de microflujo de llamada con los ajustes siguientes\:
01e21117-9a4a-4f6e-830f-fdd1cf856365=
088a93bd-a78c-4bce-9340-d3e8d08328ce=a. Microflujo\: EXCR_Commons.ACT_Configuration_GetOrCreate\r\nb. Tipo de retorno\: EXCR_Commons.Configuration\r\nc. Utilizar la variable de retorno\: S\u00ed\r\nd. Nombre del objeto\: Configuraci\u00f3n
a58c1de0-fdeb-40fb-9018-e86ee694c747=
cdbad9b6-0fa6-4642-9eff-577c1ad6fafc=2. En la acci\u00f3n Llamar a REST, ahora puede utilizar $Configuration/ServerURL y $Configuration/AccessToken.
