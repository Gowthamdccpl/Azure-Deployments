3b7f1041-6a63-4df0-a7e1-d8dfcc4bddfc=setTimeout(function() {\r\n\r\n    var dropdowns \= document.querySelectorAll('.ESignature_EProcedure .PrefixCustomDropdown__control');\r\n\r\n    if (dropdowns) {\r\n\r\n        dropdowns.forEach(function(dropdown) {\r\n\r\n            dropdown.addEventListener('mousedown', function(event) {\r\n\r\n                setTimeout(function() {\r\n                    setDropdownPos(dropdown);\r\n                }, 200);\r\n\r\n            });\r\n\r\n        });\r\n\r\n    } else {\r\n        console.error("Could not find dropdown to attach listener.");\r\n    }\r\n\r\n}, 1000);\r\n\r\n\r\nfunction setDropdownPos(dropdown) {\r\n    const rect \= dropdown.getBoundingClientRect();\r\n    const panel \= document.querySelector('.ESignature_EProcedure .PrefixCustomDropdown__menu');\r\n    const esigPanelWidth \= document.querySelector('div[role\=dialog]').offsetWidth * 1.5;\r\n    const esigPanelHeight \= document.querySelector('div[role\=dialog]').offsetHeight * 1.5;\r\n    const sideWidth \= (window.innerWidth - esigPanelWidth) / 2;\r\n    const sideHeight \= (window.innerHeight - esigPanelHeight) / 2;\r\n\r\n    panel.style.position \= 'fixed';\r\n    const width \= (rect.left - sideWidth) / 1.5;\r\n    const height \= (rect.top - sideHeight + rect.height) / 1.5;\r\n    panel.style.top \= height + 'px';\r\n    panel.style.left \= width + 'px';\r\n    panel.style.width \= "150px";\r\n}
