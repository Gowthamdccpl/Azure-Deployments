{{- if .Values.appServerSf.enabled -}}
{{- if .Values.appServerSf.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-server-sf
  labels:
    {{- include "opcenter-core.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-server-sf
  minReplicas: {{ .Values.appServerSf.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.appServerSf.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.appServerSf.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.appServerSf.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.appServerSf.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.appServerSf.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}