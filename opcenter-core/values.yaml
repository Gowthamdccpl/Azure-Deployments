# Copyright Siemens 2024
# Default values for opcenter-core.

nameOverride: ""
fullnameOverride: ""

# cloudProvider: Azure, AWS
cloudProvider: Azure

certificates:
  

config:
  # metadataPath: The path within the File Share that this deployment should use for its files (metadata, WCF services, portal files, etc.). Should have the form: factory\revision
  metadataPath: "namespace\\2410"
  
  # sharedNamespace: The name of the Opcenter Core shared namespace. In most cases, it should be left to its default, shared.
  sharedNamespace: shared

appServer:                  # app server pod configuration...........
  image:
    # repository: The container registry location for the app server image. Format: registry/image. Example: myregistry.azurecr.io/app-server
    repository: opcenteracr.azurecr.io/app-server
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion. Example "8.7"
    tag: "2504.0002"

  imagePullSecrets: []

  # connectMOM: If interfacing with Connect MOM, a different image is used, along with its configuration. Instead of using the app-server image, we will use app-server-with-connect.
  connectMOM:
    # enabled: If Connect MOM is present, true. Otherwise, false.
    enabled: false
    image:
      # repository: The container registry location for the app server (with connect) image. Format: registry/image. Example: myregistry.azurecr.io/app-server-with-connect
      repository: opcenteracr.azurecr.io/app-server-with-connect
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion. Example: "8.7"
      tag: "2504.0002"
    # mountPassphrase and mountPassword: If true, secrets as environment variables will be sent into the app server pod. If using Connect MOM, these should be true unless the secrets are being created manually or by a system policy.
    mountPassphrase: true
    mountPassword: true

  # replicaCount: For the app server. If ConnectMOM is present, and "asynchronous" transactions are used, this must be 1.
  replicaCount: 1

  # autoScaling: For the app server pods.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}

  podAnnotations: {}
  
  nodeSelectors: {}

  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  resources: {}

  extraEnv: 
    - name: OPCORE_LICENSE_SERVER
      value: "29000@license-server.shared.svc.cluster.local"
  
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

  tolerations: []

  affinity: {}

  service:
    type: ClusterIP
    port: 80

  # App Server Ingress Resource
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    sslRedirect: false
    forceAffinity: true
    clusterIssuer: ""
    host: "app.dccpl-opcenter-cloud.com"
    tls: false
    maxBodySize: 15m

  ipIngress:
    enabled: false
    className: nginx
    annotations: {}

# connectServiceAccount: Configuration for service account credentials.
  connectServiceAccount:
    enabled: false
    username: ""
    password: ""

# connectRestApi: Configuration for rest api credentials.
  connectRestApi:
    username: ""
    password: ""

