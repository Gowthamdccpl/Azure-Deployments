portal:               # portal pod configuration.............
  image:
    repository: opcenteracr.azurecr.io/portal
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "2504.0002"

  imagePullSecrets: []

  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}

  podAnnotations: {}
  
  nodeSelectors: {}

  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  resources: {}
  
  extraEnv:
    - name: OPCORE_HTTPS_CERTIFICATE_PATH
      value: "C:\\opcenter-metadata\\namespace\\2410\\certificates\\portal\\portal.pfx"
    - name: OPCORE_HTTPS_CERTIFICATE_PASSWORD
      value: "Password1234"
    - name: OPCENTER_METADATA_PATH
      value: "namespace\\2410\\portal"
    - name: OPCORE_IsContainer
      value: "true"
    - name: OPCORE_TelemetryAppName
      value: Portal
    - name: OPCORE_EnableTelemetry
      value: "false"
    - name: OPCORE_TelemetryConnectionString
      value: ""
    - name: OPCORE_TelemetryDLLErrorLogging
      value: "false"
    - name: OPCORE_TelemetryDLLLogFolderPath
      value: ""
    - name: OPCORE_WCF_TelemetryAppName
      value: WCF
    - name: OPCORE_WCF_EnableTelemetry
      value: "false"
    - name: OPCORE_WCF_TelemetryConnectionString
      value: ""
    - name: OPCORE_WCF_TelemetryDLLErrorLogging
      value: "false"
    - name: OPCORE_WCF_TelemetryDLLLogFolderPath
      value: ""
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

  tolerations: []

  affinity: {}

  service:
    type: ClusterIP
    port: 80

  # Portal Ingress Resource        for portal pod...........
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 16m
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    sslRedirect: false
    forceAffinity: true
    clusterIssuer: ""
    host: portal.dccpl-opcenter-cloud.com
    tls: false
    maxBodySize: 15m

