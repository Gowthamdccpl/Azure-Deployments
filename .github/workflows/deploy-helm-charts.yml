name: Helm deploy to Azure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - redeploy
          - destroy
  push:
    branches:
      - master
    paths:
      - "opcenter-core/**"
      - "opcenter-core-config/**"
      - "opcenter-core-dbupdate/**"
      - "opcenter-core-shared/**"
      - "terraform/**"
      - ".github/workflows/deploy-helm-charts.yml"

concurrency:
  group: helm-main-azure
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHARED_NAMESPACE: shared
  OPCENTER_NAMESPACE: dev-opcenter
  OPCENTER_METADATA_PVC: opcenter-metadata-pvc-dev-opcenter
  WINDOWS_NODE_SELECTOR_KEY: kubernetes.azure.com/agentpool
  WINDOWS_NODE_SELECTOR_VALUE: window
  SOURCE_STORAGE_ACCOUNT_NAME: linepilotdbbackup
  SOURCE_CONTAINER_NAME: opcenter-files
  DEST_FILE_SHARE_NAME: opcentershare

jobs:
  approve_redeploy:
    name: Manual approval before Helm uninstall
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'redeploy' }}
    environment:
      name: production-approval

    steps:
      - name: Approval granted
        run: echo "Approved to uninstall existing Helm releases before redeploy."

  helm_deploy:
    name: Helm deploy
    runs-on: ubuntu-latest
    needs:
      - approve_redeploy
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        github.event.inputs.action == 'deploy' ||
        needs.approve_redeploy.result == 'success'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init
        working-directory: terraform
        env:
          ARM_USE_CLI: true
          TF_STATE_RESOURCE_GROUP_NAME: ${{ secrets.TFSTATE_RG }}
          TF_STATE_STORAGE_ACCOUNT_NAME: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER_NAME: ${{ secrets.TFSTATE_CONTAINER }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_STATE_STORAGE_ACCOUNT_KEY: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TF_STATE_RESOURCE_GROUP_NAME:-}" || -z "${TF_STATE_STORAGE_ACCOUNT_NAME:-}" || -z "${TF_STATE_CONTAINER_NAME:-}" ]]; then
            echo "Terraform Azure backend secrets TFSTATE_RG, TFSTATE_STORAGE_ACCOUNT, TFSTATE_CONTAINER must be set."
            exit 1
          fi

          if [[ -z "${TF_STATE_STORAGE_ACCOUNT_KEY:-}" ]]; then
            TF_STATE_STORAGE_ACCOUNT_KEY="$(az storage account keys list \
              --resource-group "$TF_STATE_RESOURCE_GROUP_NAME" \
              --account-name "$TF_STATE_STORAGE_ACCOUNT_NAME" \
              --query '[0].value' -o tsv)"
            if [[ -z "$TF_STATE_STORAGE_ACCOUNT_KEY" ]]; then
              echo "Failed to fetch storage account key for $TF_STATE_STORAGE_ACCOUNT_NAME"
              exit 1
            fi
          fi

          terraform init \
            -input=false \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP_NAME" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT_NAME" \
            -backend-config="container_name=$TF_STATE_CONTAINER_NAME" \
            -backend-config="key=${TF_STATE_KEY:-azure-helm.tfstate}" \
            -backend-config="access_key=$TF_STATE_STORAGE_ACCOUNT_KEY"

      - name: Terraform apply
        working-directory: terraform
        env:
          ARM_USE_CLI: true
          TF_VAR_acr_name: ${{ vars.ACR_NAME }}
          TF_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME }}
          TF_VAR_windows_admin_username: ${{ vars.WINDOWS_ADMIN_USERNAME }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
        run: terraform apply -input=false -auto-approve

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          resource_group_name="$(terraform -chdir=terraform output -raw resource_group_name)"
          aks_name="$(terraform -chdir=terraform output -raw aks_name)"

          az aks get-credentials \
            --resource-group "$resource_group_name" \
            --name "$aks_name" \
            --overwrite-existing

      - name: Preserve existing metadata PV and PVC
        id: preserve_storage
        shell: bash
        run: |
          set -euo pipefail

          pvc_backup="$RUNNER_TEMP/${OPCENTER_METADATA_PVC}.json"
          pv_backup="$RUNNER_TEMP/${OPCENTER_METADATA_PVC}-pv.json"

          if ! kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE"; then
            echo "Existing PVC $OPCENTER_METADATA_PVC was not found in namespace $OPCENTER_NAMESPACE."
            echo "preserved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pvc_phase="$(kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o jsonpath='{.status.phase}')"
          if [[ "$pvc_phase" != "Bound" ]]; then
            echo "Existing PVC $OPCENTER_METADATA_PVC is $pvc_phase, expected Bound."
            exit 1
          fi

          pv_name="$(kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o jsonpath='{.spec.volumeName}')"

          kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o json \
            | jq 'del(
                .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"],
                .metadata.creationTimestamp,
                .metadata.resourceVersion,
                .metadata.uid,
                .metadata.managedFields,
                .metadata.finalizers,
                .metadata.ownerReferences,
                .status
              )' > "$pvc_backup"

          if [[ -n "$pv_name" ]]; then
            kubectl get pv "$pv_name" -o json \
              | jq 'del(
                  .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"],
                  .metadata.creationTimestamp,
                  .metadata.resourceVersion,
                  .metadata.uid,
                  .metadata.managedFields,
                  .metadata.finalizers,
                  .metadata.ownerReferences,
                  .spec.claimRef,
                  .status
                )' > "$pv_backup"
          fi

          echo "preserved=true" >> "$GITHUB_OUTPUT"
          echo "pv_backup=$pv_backup" >> "$GITHUB_OUTPUT"
          echo "pvc_backup=$pvc_backup" >> "$GITHUB_OUTPUT"

      - name: Uninstall existing releases
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'redeploy' }}
        shell: bash
        run: |
          set -euo pipefail

          release_names=(
            "opcenter-core"
            "opcenter-core-db"
            "opcenter-core-dbupdate"
            "opcenter-core-config"
            "dev-opcenter-config"
            "opcenter-shared"
            "opcenter-core-shared"
          )

          namespaces=(
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$SHARED_NAMESPACE"
            "$SHARED_NAMESPACE"
          )

          for i in "${!release_names[@]}"; do
            release_name="${release_names[$i]}"
            namespace="${namespaces[$i]}"

            if helm status "$release_name" -n "$namespace" >/dev/null 2>&1; then
              helm uninstall "$release_name" -n "$namespace" --wait --timeout 10m
            else
              echo "Release $release_name not found in namespace $namespace; skipping uninstall."
            fi
          done

      - name: Restore existing metadata PV and PVC
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'redeploy' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.preserve_storage.outputs.preserved }}" != "true" ]]; then
            echo "No existing metadata PVC was preserved, so the fresh deploy cannot continue."
            exit 1
          fi

          pv_backup="${{ steps.preserve_storage.outputs.pv_backup }}"
          pvc_backup="${{ steps.preserve_storage.outputs.pvc_backup }}"

          if [[ -s "$pv_backup" ]]; then
            kubectl apply -f "$pv_backup"
          fi

          kubectl apply -f "$pvc_backup"

      - name: Copy source blob files to Azure file share
        id: copy_storage_files
        shell: bash
        env:
          SOURCE_CONTAINER_SAS_TOKEN: ${{ secrets.SOURCE_CONTAINER_SAS_TOKEN }}
          DEST_STORAGE_ACCOUNT_NAME: ${{ vars.DEST_STORAGE_ACCOUNT_NAME }}
        run: |
          set -euo pipefail

          if [[ -z "$SOURCE_CONTAINER_SAS_TOKEN" ]]; then
            echo "GitHub Actions secret SOURCE_CONTAINER_SAS_TOKEN is required."
            exit 1
          fi

          source_sas_token="${SOURCE_CONTAINER_SAS_TOKEN#\?}"
          dest_storage_account="$DEST_STORAGE_ACCOUNT_NAME"
          dest_file_share="$DEST_FILE_SHARE_NAME"
          resource_group_name=""

          if [[ -z "$dest_storage_account" && -d terraform ]]; then
            dest_storage_account="$(terraform -chdir=terraform output -raw storage_account_name 2>/dev/null || true)"
          fi

          if [[ -d terraform ]]; then
            resource_group_name="$(terraform -chdir=terraform output -raw resource_group_name 2>/dev/null || true)"
            terraform_file_share="$(terraform -chdir=terraform output -raw file_share_name 2>/dev/null || true)"
            if [[ -n "$terraform_file_share" ]]; then
              dest_file_share="$terraform_file_share"
            fi
          fi

          if [[ -z "$dest_storage_account" ]]; then
            echo "Destination storage account name was not found."
            echo "Set repository variable DEST_STORAGE_ACCOUNT_NAME or make Terraform outputs available before this step."
            exit 1
          fi

          if [[ -z "$resource_group_name" ]]; then
            echo "Terraform output resource_group_name is required to fetch the destination storage account key."
            exit 1
          fi

          dest_storage_account_key="$(az storage account keys list \
            --resource-group "$resource_group_name" \
            --account-name "$dest_storage_account" \
            --query '[0].value' \
            -o tsv)"

          seed_dir="$RUNNER_TEMP/$SOURCE_CONTAINER_NAME"
          rm -rf "$seed_dir"
          mkdir -p "$seed_dir"

          az storage blob download-batch \
            --account-name "$SOURCE_STORAGE_ACCOUNT_NAME" \
            --sas-token "$source_sas_token" \
            --source "$SOURCE_CONTAINER_NAME" \
            --destination "$seed_dir" \
            --only-show-errors

          az storage file upload-batch \
            --account-name "$dest_storage_account" \
            --account-key "$dest_storage_account_key" \
            --destination "$dest_file_share" \
            --source "$seed_dir" \
            --only-show-errors

          echo "storage_account_name=$dest_storage_account" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$dest_storage_account_key"
          echo "storage_account_key=$dest_storage_account_key" >> "$GITHUB_OUTPUT"
          echo "file_share_name=$dest_file_share" >> "$GITHUB_OUTPUT"

      - name: Deploy shared chart
        shell: bash
        run: |
          set -euo pipefail

          chart_dir="opcenter-core-shared"
          release_name="opcenter-shared"
          namespace="$SHARED_NAMESPACE"
          values_file="$chart_dir/updated-${chart_dir}-values.yaml"

          if [[ ! -f "$values_file" ]]; then
            values_file="$chart_dir/values.yaml"
          fi

          helm lint "$chart_dir" \
            --values "$values_file" \
            --set storage.secret.create=true \
            --set storage.secret.accountname="${{ steps.copy_storage_files.outputs.storage_account_name }}" \
            --set storage.secret.accountkey="${{ steps.copy_storage_files.outputs.storage_account_key }}"

          helm upgrade --install "$release_name" "$chart_dir" \
            -n "$namespace" \
            --create-namespace \
            --values "$values_file" \
            --set storage.secret.create=true \
            --set storage.secret.accountname="${{ steps.copy_storage_files.outputs.storage_account_name }}" \
            --set storage.secret.accountkey="${{ steps.copy_storage_files.outputs.storage_account_key }}" \
            --wait \
            --timeout 10m

      - name: Deploy application charts
        shell: bash
        run: |
          set -euo pipefail

          chart_dirs=(
            "opcenter-core-config"
            "opcenter-core-dbupdate"
            "opcenter-core"
          )

          release_names=(
            "opcenter-core-config"
            "opcenter-core-db"
            "opcenter-core"
          )

          namespaces=(
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
          )

          for i in "${!chart_dirs[@]}"; do
            chart_dir="${chart_dirs[$i]}"
            release_name="${release_names[$i]}"
            namespace="${namespaces[$i]}"
            values_file="$chart_dir/updated-${chart_dir}-values.yaml"
            extra_values_args=()

            if [[ ! -f "$values_file" ]]; then
              values_file="$chart_dir/values.yaml"
            fi

            if [[ "$chart_dir" == "opcenter-core" ]]; then
              windows_values_file="$RUNNER_TEMP/opcenter-core-azure-windows-node-selectors.yaml"
              printf '%s\n' \
                'appServer:' \
                '  nodeSelectors:' \
                "    \"$WINDOWS_NODE_SELECTOR_KEY\": \"$WINDOWS_NODE_SELECTOR_VALUE\"" \
                'appServerSf:' \
                '  nodeSelectors:' \
                "    \"$WINDOWS_NODE_SELECTOR_KEY\": \"$WINDOWS_NODE_SELECTOR_VALUE\"" \
                'portal:' \
                '  nodeSelectors:' \
                "    \"$WINDOWS_NODE_SELECTOR_KEY\": \"$WINDOWS_NODE_SELECTOR_VALUE\"" \
                'notificationService:' \
                '  nodeSelectors:' \
                "    \"$WINDOWS_NODE_SELECTOR_KEY\": \"$WINDOWS_NODE_SELECTOR_VALUE\"" \
                'securityServices:' \
                '  nodeSelectors:' \
                "    \"$WINDOWS_NODE_SELECTOR_KEY\": \"$WINDOWS_NODE_SELECTOR_VALUE\"" \
                'inlinespc:' \
                '  nodeSelectors:' \
                "    \"$WINDOWS_NODE_SELECTOR_KEY\": \"$WINDOWS_NODE_SELECTOR_VALUE\"" \
                > "$windows_values_file"
              extra_values_args+=(--values "$windows_values_file")
            fi

            helm lint "$chart_dir" --values "$values_file" "${extra_values_args[@]}"

            helm upgrade --install "$release_name" "$chart_dir" \
              -n "$namespace" \
              --create-namespace \
              --values "$values_file" \
              "${extra_values_args[@]}" \
              --wait \
              --timeout 10m
          done

  approve_destroy:
    name: Manual approval before destroy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    environment:
      name: production-approval

    steps:
      - name: Approval granted
        run: echo "Approved to uninstall Helm releases."

  destroy:
    name: Helm uninstall
    runs-on: ubuntu-latest
    needs: approve_destroy
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Uninstall Helm releases
        shell: bash
        run: |
          set -euo pipefail

          release_names=(
            "opcenter-core"
            "opcenter-core-db"
            "opcenter-core-dbupdate"
            "opcenter-core-config"
            "dev-opcenter-config"
            "opcenter-shared"
            "opcenter-core-shared"
          )

          namespaces=(
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$SHARED_NAMESPACE"
            "$SHARED_NAMESPACE"
          )

          for i in "${!release_names[@]}"; do
            release_name="${release_names[$i]}"
            namespace="${namespaces[$i]}"

            if helm status "$release_name" -n "$namespace" >/dev/null 2>&1; then
              helm uninstall "$release_name" -n "$namespace" --wait --timeout 10m
            else
              echo "Release $release_name not found in namespace $namespace; skipping uninstall."
            fi
          done
