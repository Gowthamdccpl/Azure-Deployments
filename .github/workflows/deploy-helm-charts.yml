name: Terraform and Helm deploy to Azure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        default: deploy
        type: choice
        options: [deploy, redeploy, destroy]
  push:
    branches: [master]

concurrency:
  group: terraform-helm-main-azure
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_DIR: terraform
  TF_INPUT: "false"
  TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP_NAME }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT_NAME }}
  TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER_NAME }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  SHARED_NAMESPACE: shared
  OPCENTER_NAMESPACE: dev-opcenter
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
  WINDOWS_ADMIN_USERNAME: ${{ vars.WINDOWS_ADMIN_USERNAME }}
  WINDOWS_ADMIN_PASSWORD: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
  SQL_SERVER_FQDN: ${{ vars.SQL_SERVER_FQDN }}
  SQL_DATABASE_NAME: ${{ vars.SQL_DATABASE_NAME }}
  SQL_DATABASE_SCHEMA: ${{ vars.SQL_DATABASE_SCHEMA }}
  SQL_DATABASE_USERNAME: ${{ secrets.SQL_DATABASE_USERNAME }}
  SQL_DATABASE_PASSWORD: ${{ secrets.SQL_DATABASE_PASSWORD }}

jobs:
  terraform_apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy' || github.event.inputs.action == 'redeploy'
    outputs:
      aks_cluster_name: ${{ steps.outputs.outputs.aks_cluster_name }}
      resource_group_name: ${{ steps.outputs.outputs.resource_group_name }}
      storage_account_name: ${{ steps.outputs.outputs.storage_account_name }}
      file_share_name: ${{ steps.outputs.outputs.file_share_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Prepare Terraform remote state
        shell: bash
        run: |
          set -euo pipefail
          az group create --name "$TF_STATE_RESOURCE_GROUP" --location "South India" --output none
          az storage account create --name "$TF_STATE_STORAGE_ACCOUNT" --resource-group "$TF_STATE_RESOURCE_GROUP" --location "South India" --sku Standard_LRS --kind StorageV2 --min-tls-version TLS1_2 --output none
          az storage container create --name "$TF_STATE_CONTAINER" --account-name "$TF_STATE_STORAGE_ACCOUNT" --auth-mode login --output none
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" -backend-config="container_name=${TF_STATE_CONTAINER}" -backend-config="key=${TF_STATE_KEY}"
      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate
      - name: Import existing infrastructure when needed
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        env:
          TF_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME }}
          TF_VAR_windows_admin_username: ${{ vars.WINDOWS_ADMIN_USERNAME }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          subscription_id="$(az account show --query id -o tsv)"
          import_if_missing() {
            local address="$1" id="$2"
            terraform state show "$address" >/dev/null 2>&1 || terraform import "$address" "$id"
          }
          rg_id="/subscriptions/${subscription_id}/resourceGroups/terraform-resource-group"
          if az group show --name terraform-resource-group >/dev/null 2>&1; then import_if_missing azurerm_resource_group.rg "$rg_id"; fi
          sa_id="$(az storage account show --name "$TF_VAR_storage_account_name" --resource-group terraform-resource-group --query id -o tsv 2>/dev/null || true)"
          if [[ -n "$sa_id" ]]; then import_if_missing module.storage.azurerm_storage_account.storage "$sa_id"; fi
          aks_id="$(az aks show --name terraform-aks --resource-group terraform-resource-group --query id -o tsv 2>/dev/null || true)"
          if [[ -n "$aks_id" ]]; then import_if_missing module.aks.azurerm_kubernetes_cluster.aks "$aks_id"; fi
      - name: Terraform plan and apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME }}
          TF_VAR_windows_admin_username: ${{ vars.WINDOWS_ADMIN_USERNAME }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
        run: terraform plan -out=tfplan && terraform apply -auto-approve tfplan
      - name: Read Terraform outputs
        id: outputs
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          echo "aks_cluster_name=$(terraform output -raw aks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "storage_account_name=$(terraform output -raw storage_account_name)" >> "$GITHUB_OUTPUT"
          echo "file_share_name=$(terraform output -raw file_share_name)" >> "$GITHUB_OUTPUT"

  approve_redeploy:
    name: Approve Helm release replacement
    runs-on: ubuntu-latest
    needs: terraform_apply
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'redeploy'
    environment: production-approval
    steps:
      - run: echo "Approved to reinstall the Helm releases."

  helm_deploy:
    name: Deploy Helm charts and public portal
    runs-on: ubuntu-latest
    needs: [terraform_apply, approve_redeploy]
    if: always() && needs.terraform_apply.result == 'success' && (github.event_name == 'push' || github.event.inputs.action == 'deploy' || needs.approve_redeploy.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Configure AKS access
        run: az aks get-credentials --resource-group "${{ needs.terraform_apply.outputs.resource_group_name }}" --name "${{ needs.terraform_apply.outputs.aks_cluster_name }}" --overwrite-existing
      - name: Install AzCopy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/azcopy"
          curl -fsSL https://aka.ms/downloadazcopy-v10-linux | tar -xz -C "$RUNNER_TEMP/azcopy" --strip-components=1
          echo "$RUNNER_TEMP/azcopy" >> "$GITHUB_PATH"
      - name: Seed new Azure File Share from source Blob Storage
        shell: bash
        env:
          SOURCE_BLOB_PREFIX: ${{ vars.SEED_SOURCE_BLOB_PREFIX }}
          DESTINATION_SUBDIRECTORY: ${{ vars.SEED_DESTINATION_SUBDIRECTORY }}
          SOURCE_CONTAINER_SAS_TOKEN: ${{ secrets.SOURCE_CONTAINER_SAS_TOKEN }}
          DEST_STORAGE_ACCOUNT: ${{ needs.terraform_apply.outputs.storage_account_name }}
          DEST_FILE_SHARE: ${{ needs.terraform_apply.outputs.file_share_name }}
          DEST_RESOURCE_GROUP: ${{ needs.terraform_apply.outputs.resource_group_name }}
        run: |
          set -euo pipefail
          : "${SOURCE_CONTAINER_SAS_TOKEN:?Set secret SOURCE_CONTAINER_SAS_TOKEN}"
          DEST_STORAGE_ACCOUNT_KEY="$(az storage account keys list \
            --account-name "$DEST_STORAGE_ACCOUNT" \
            --resource-group "$DEST_RESOURCE_GROUP" \
            --query '[0].value' --output tsv)"
          echo "::add-mask::$DEST_STORAGE_ACCOUNT_KEY"

          # A populated share indicates a prior seed/deployment; never overlay it automatically.
          existing_count="$(az storage file list \
            --account-name "$DEST_STORAGE_ACCOUNT" \
            --account-key "$DEST_STORAGE_ACCOUNT_KEY" \
            --share-name "$DEST_FILE_SHARE" \
            --query 'length(@)' --output tsv)"
          if [[ "$existing_count" -gt 0 ]]; then
            echo "Destination share already contains $existing_count entries; skipping seed copy."
            exit 0
          fi

          source_url="https://linepilotdbbackup.blob.core.windows.net/opcenter-files"
          if [[ -n "${SOURCE_BLOB_PREFIX:-}" ]]; then
            source_url="${source_url}/${SOURCE_BLOB_PREFIX#/}"
          fi
          destination_url="https://${DEST_STORAGE_ACCOUNT}.file.core.windows.net/${DEST_FILE_SHARE}"
          if [[ -n "${DESTINATION_SUBDIRECTORY:-}" ]]; then
            destination_url="${destination_url}/${DESTINATION_SUBDIRECTORY#/}"
          fi

          echo "::add-mask::$DEST_STORAGE_ACCOUNT_KEY"
          echo "::add-mask::$SOURCE_CONTAINER_SAS_TOKEN"
          destination_sas="$(az storage share generate-sas \
            --account-name "$DEST_STORAGE_ACCOUNT" \
            --account-key "$DEST_STORAGE_ACCOUNT_KEY" \
            --name "$DEST_FILE_SHARE" \
            --permissions rwdl \
            --expiry "$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%MZ')" \
            --output tsv)"
          echo "::add-mask::$destination_sas"

          source_sas="${SOURCE_CONTAINER_SAS_TOKEN#\?}"
          azcopy copy "${source_url}?${source_sas}" "${destination_url}?${destination_sas}" --recursive=true --only-show-errors
      - name: Create chart override values
        shell: bash
        env:
          STORAGE_ACCOUNT_NAME: ${{ needs.terraform_apply.outputs.storage_account_name }}
          FILE_SHARE_NAME: ${{ needs.terraform_apply.outputs.file_share_name }}
        run: |
          set -euo pipefail
          : "${SQL_SERVER_FQDN:?SQL server FQDN is required}"
          : "${SQL_DATABASE_NAME:?SQL database name is required}"
          : "${SQL_DATABASE_SCHEMA:?SQL database schema is required}"
          : "${SQL_DATABASE_USERNAME:?Set secret SQL_DATABASE_USERNAME}"
          : "${SQL_DATABASE_PASSWORD:?Set secret SQL_DATABASE_PASSWORD}"
          : "${WINDOWS_ADMIN_USERNAME:?Set repository variable WINDOWS_ADMIN_USERNAME}"
          : "${WINDOWS_ADMIN_PASSWORD:?Set secret WINDOWS_ADMIN_PASSWORD}"
          storage_key="$(az storage account keys list --account-name "$STORAGE_ACCOUNT_NAME" --query '[0].value' -o tsv)"
          echo "::add-mask::$storage_key"
          echo "::add-mask::$WINDOWS_ADMIN_PASSWORD"
          echo "::add-mask::$SQL_DATABASE_PASSWORD"
          cat > "$RUNNER_TEMP/shared-values.yaml" <<EOF
          database:
            host: "$SQL_SERVER_FQDN"
            port: 1433
          odsDatabase:
            host: "$SQL_SERVER_FQDN"
            port: 1433
          storage:
            secret:
              create: true
              accountname: "$STORAGE_ACCOUNT_NAME"
              accountkey: "$storage_key"
          EOF
          cat > "$RUNNER_TEMP/config-values.yaml" <<EOF
          database:
            host: "$SQL_SERVER_FQDN"
            port: 1433
            username: "$SQL_DATABASE_USERNAME"
            password: "$SQL_DATABASE_PASSWORD"
            schema: "$SQL_DATABASE_SCHEMA"
            database: "$SQL_DATABASE_NAME"
            name: "$SQL_DATABASE_NAME"
            type: SQLServer
            maxRowsetSize: 15000
          storage:
            fileShare: "$FILE_SHARE_NAME"
          EOF
          cat > "$RUNNER_TEMP/core-values.yaml" <<EOF
          portal:
            ingress:
              enabled: false
          appServer:
            ingress:
              enabled: false
          EOF
          cat > "$RUNNER_TEMP/dbupdate-values.yaml" <<EOF
          image:
            repository: opcenteracr.azurecr.io/dbupdate
            tag: "2504.0002"
          updateType: metadata-only
          metadataPath: "namespace\\2410"
          stagingPath: "namespace\\2410\\staging"
          EOF
          chmod 600 "$RUNNER_TEMP"/*-values.yaml
      - name: Install SMB CSI driver
        shell: bash
        run: |
          set -euo pipefail
          helm repo add csi-driver-smb https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
          helm repo update
          helm upgrade --install csi-driver-smb csi-driver-smb/csi-driver-smb --namespace kube-system --version v1.15.0 --set windows.enabled=true
      - name: Redeploy uninstall (if selected)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'redeploy'
        shell: bash
        run: |
          set -euo pipefail
          for release in opcenter-core opcenter-core-dbupdate dev-opcenter-config; do helm uninstall "$release" -n "$OPCENTER_NAMESPACE" --wait --timeout 10m || true; done
          helm uninstall opcenter-shared -n "$SHARED_NAMESPACE" --wait --timeout 10m || true
      - name: Deploy shared services and storage secret
        shell: bash
        run: |
          set -euo pipefail
          helm lint opcenter-core-shared -f opcenter-core-shared/values.yaml -f "$RUNNER_TEMP/shared-values.yaml"
          helm upgrade --install opcenter-shared opcenter-core-shared -n "$SHARED_NAMESPACE" --create-namespace -f opcenter-core-shared/values.yaml -f "$RUNNER_TEMP/shared-values.yaml" --wait --timeout 10m
      - name: Deploy config and persistent storage
        shell: bash
        run: |
          set -euo pipefail
          helm lint opcenter-core-config -f opcenter-core-config/values.yaml -f "$RUNNER_TEMP/config-values.yaml"
          helm upgrade --install dev-opcenter-config opcenter-core-config -n "$OPCENTER_NAMESPACE" --create-namespace -f opcenter-core-config/values.yaml -f "$RUNNER_TEMP/config-values.yaml" --wait --timeout 10m
      - name: Deploy application chart with TLS override
        shell: bash
        run: |
          set -euo pipefail
          helm lint opcenter-core -f opcenter-core/values.yaml -f "$RUNNER_TEMP/core-values.yaml" -f public-portal/portal-tls-values.yaml
          helm upgrade --install opcenter-core opcenter-core -n "$OPCENTER_NAMESPACE" --create-namespace -f opcenter-core/values.yaml -f "$RUNNER_TEMP/core-values.yaml" -f public-portal/portal-tls-values.yaml --wait --timeout 20m
      # Database metadata updates are currently run manually from Management Studio.
      # Re-enable this step when database updates should be handled by the workflow.
      # - name: Run database metadata update job
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     helm lint opcenter-core-dbupdate -f opcenter-core-dbupdate/values.yaml -f "$RUNNER_TEMP/dbupdate-values.yaml"
      #     helm upgrade --install opcenter-core-dbupdate opcenter-core-dbupdate -n "$OPCENTER_NAMESPACE" --create-namespace -f opcenter-core-dbupdate/values.yaml -f "$RUNNER_TEMP/dbupdate-values.yaml" --wait --timeout 30m --wait-for-jobs
      - name: Apply public portal gateway
        run: kubectl apply -f public-portal/gateway.yaml

  approve_destroy:
    name: Approve destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: production-approval
    steps:
      - run: echo "Approved to destroy Azure infrastructure."

  destroy:
    name: Destroy Azure infrastructure
    runs-on: ubuntu-latest
    needs: approve_destroy
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Initialize Terraform
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" -backend-config="container_name=${TF_STATE_CONTAINER}" -backend-config="key=${TF_STATE_KEY}"
      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME }}
          TF_VAR_windows_admin_username: ${{ vars.WINDOWS_ADMIN_USERNAME }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
        run: terraform destroy -auto-approve
