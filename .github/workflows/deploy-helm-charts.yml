name: Terraform and Helm deploy to Azure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - redeploy
          - destroy
      blob_seed_prefix:
        description: "Optional Blob prefix/folder to copy into File Share"
        required: false
        type: string
      file_share_name:
        description: "Azure File Share name"
        required: false
        default: opcentershare
        type: string
      file_share_seed_subdirectory:
        description: "Optional destination folder inside File Share"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "opcenter-core/**"
      - "opcenter-core-config/**"
      - "opcenter-core-dbupdate/**"
      - "opcenter-core-shared/**"
      - ".github/workflows/deploy-helm-charts-azure.yml"

concurrency:
  group: terraform-helm-main-azure
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_DIR: terraform
  TF_INPUT: "false"
  TF_RESOURCE_NAME: opcenter-dev
  TF_STATE_RESOURCE_GROUP:  ${{ vars.TF_STATE_RESOURCE_GROUP_NAME }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT_NAME }}
  TF_STATE_CONTAINER:       ${{ vars.TF_STATE_CONTAINER_NAME }}
  TF_STATE_KEY:             ${{ vars.TF_STATE_KEY }}
  SHARED_NAMESPACE:         shared
  OPCENTER_NAMESPACE:       dev-opcenter
  SHARED_METADATA_PVC:      opcenter-metadata-pvc-shared
  OPCENTER_METADATA_PVC:    opcenter-metadata-pvc-dev-opcenter
  WINDOWS_NODE_SELECTOR_OS_KEY:    kubernetes.io/os
  WINDOWS_NODE_SELECTOR_OS_VALUE:  windows
  WINDOWS_NODE_SELECTOR_BUILD_KEY: node.kubernetes.io/windows-build
  WINDOWS_NODE_SELECTOR_BUILD_VALUE: "10.0.20348"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 – Terraform apply
  # ─────────────────────────────────────────────────────────────
  terraform_apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.action == 'deploy' ||
      github.event.inputs.action == 'redeploy'

    outputs:
      aks_cluster_name:        ${{ steps.tf_outputs.outputs.aks_cluster_name }}
      resource_group_name:     ${{ steps.tf_outputs.outputs.resource_group_name }}
      sql_server_fqdn:         ${{ steps.tf_outputs.outputs.sql_server_fqdn }}
      sql_database_name:       ${{ steps.tf_outputs.outputs.sql_database_name }}
      storage_account_name:    ${{ steps.tf_outputs.outputs.storage_account_name }}
      file_share_name:         ${{ steps.tf_outputs.outputs.file_share_name }}
      acr_login_server:        ${{ steps.tf_outputs.outputs.acr_login_server }}
      kv_name:                 ${{ steps.tf_outputs.outputs.kv_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Bootstrap the remote-state storage account (idempotent) ──────────
      - name: Prepare Terraform remote state
        shell: bash
        run: |
          set -euo pipefail

          az group create \
            --name    "$TF_STATE_RESOURCE_GROUP" \
            --location "South India" \
            --output none \
            2>/dev/null || true

          az storage account create \
            --name                "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group      "$TF_STATE_RESOURCE_GROUP" \
            --location            "South India" \
            --sku                 Standard_LRS \
            --kind                StorageV2 \
            --min-tls-version     TLS1_2 \
            --output none \
            2>/dev/null || true

          az storage container create \
            --name                "$TF_STATE_CONTAINER" \
            --account-name        "$TF_STATE_STORAGE_ACCOUNT" \
            --auth-mode           login \
            --output none \
            2>/dev/null || true

          echo "Backend storage ready: $TF_STATE_STORAGE_ACCOUNT / $TF_STATE_CONTAINER"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}"

      - name: Terraform format check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # ── Import existing partial resources (idempotent) ─────────────────
      - name: Import existing partial resources
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        env:
          TF_VAR_acr_name:               ${{ vars.ACR_NAME }}
          TF_VAR_storage_account_name:   ${{ vars.STORAGE_ACCOUNT_NAME }}
          TF_VAR_windows_admin_username: ${{ vars.WINDOWS_ADMIN_USERNAME }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
          TF_VAR_file_share_name:        ${{ github.event.inputs.file_share_name || 'opcentershare' }}
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local id="$2"
            if terraform state show "$address" >/dev/null 2>&1; then
              echo "Already in state: $address – skipping import."
              return 0
            fi
            terraform import "$address" "$id"
          }

          subscription_id="$(az account show --query id -o tsv)"

          # Resource Group
          rg_id="/subscriptions/${subscription_id}/resourceGroups/terraform-resource-group"
          if az group show --name "terraform-resource-group" >/dev/null 2>&1; then
            import_if_missing "azurerm_resource_group.rg" "$rg_id"
          fi

          # ACR
          acr_id="$(az acr show --name "$TF_VAR_acr_name" --resource-group "terraform-resource-group" --query id -o tsv 2>/dev/null || true)"
          if [[ -n "$acr_id" ]]; then
            import_if_missing "azurerm_container_registry.acr" "$acr_id"
          fi

          # Storage account
          sa_id="$(az storage account show --name "$TF_VAR_storage_account_name" --resource-group "terraform-resource-group" --query id -o tsv 2>/dev/null || true)"
          if [[ -n "$sa_id" ]]; then
            import_if_missing "azurerm_storage_account.sa" "$sa_id"
          fi

          # SQL Server
          sql_id="$(az sql server show --name "opcenter-sql-server" --resource-group "terraform-resource-group" --query id -o tsv 2>/dev/null || true)"
          if [[ -n "$sql_id" ]]; then
            import_if_missing "azurerm_mssql_server.sql" "$sql_id"
          fi

          # AKS
          aks_id="$(az aks show --name "terraform-aks" --resource-group "terraform-resource-group" --query id -o tsv 2>/dev/null || true)"
          if [[ -n "$aks_id" ]]; then
            import_if_missing "azurerm_kubernetes_cluster.aks" "$aks_id"
          fi

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_acr_name:               ${{ vars.ACR_NAME }}
          TF_VAR_storage_account_name:   ${{ vars.STORAGE_ACCOUNT_NAME }}
          TF_VAR_windows_admin_username: ${{ vars.WINDOWS_ADMIN_USERNAME }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
          TF_VAR_file_share_name:        ${{ github.event.inputs.file_share_name || 'opcentershare' }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Read Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "aks_cluster_name=$(terraform output -raw aks_cluster_name)"             >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)"       >> "$GITHUB_OUTPUT"
          echo "sql_server_fqdn=$(terraform output -raw sql_server_fqdn)"               >> "$GITHUB_OUTPUT"
          echo "sql_database_name=$(terraform output -raw sql_database_name)"           >> "$GITHUB_OUTPUT"
          echo "storage_account_name=$(terraform output -raw storage_account_name)"     >> "$GITHUB_OUTPUT"
          echo "file_share_name=$(terraform output -raw file_share_name)"               >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)"             >> "$GITHUB_OUTPUT"
          echo "kv_name=$(terraform output -raw key_vault_name 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # JOB 2 – Manual approval gate for redeploy
  # ─────────────────────────────────────────────────────────────
  approve_redeploy:
    name: Manual approval before Helm uninstall
    runs-on: ubuntu-latest
    needs: terraform_apply
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'redeploy'
    environment:
      name: production-approval

    steps:
      - name: Approval granted
        run: echo "Approved to uninstall existing Helm releases before redeploy."

  # ─────────────────────────────────────────────────────────────
  # JOB 3 – Helm deploy
  # ─────────────────────────────────────────────────────────────
  helm_deploy:
    name: Helm deploy
    runs-on: ubuntu-latest
    needs:
      - terraform_apply
      - approve_redeploy
    if: |
      always() &&
      needs.terraform_apply.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event.inputs.action == 'deploy' ||
        needs.approve_redeploy.result == 'success'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Copy Blob → Azure File Share ──────────────────────────────────────
      - name: Copy Blob container files to Azure File Share
        shell: bash
        env:
          STORAGE_ACCOUNT_NAME: ${{ needs.terraform_apply.outputs.storage_account_name }}
          FILE_SHARE_NAME:      ${{ needs.terraform_apply.outputs.file_share_name }}
          BLOB_SEED_PREFIX:     ${{ github.event.inputs.blob_seed_prefix || '' }}
          SEED_SUBDIRECTORY:    ${{ github.event.inputs.file_share_seed_subdirectory || '' }}
          SOURCE_CONTAINER_SAS: ${{ secrets.SOURCE_CONTAINER_SAS_TOKEN }}
        run: |
          set -euo pipefail

          dest_sas="$(az storage share generate-sas \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --name         "$FILE_SHARE_NAME" \
            --permissions  rwdl \
            --expiry        "$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%MZ')" \
            --auth-mode     key \
            --output        tsv)"

          dest_url="https://${STORAGE_ACCOUNT_NAME}.file.core.windows.net/${FILE_SHARE_NAME}"
          if [[ -n "$SEED_SUBDIRECTORY" ]]; then
            dest_url="${dest_url}/${SEED_SUBDIRECTORY}"
          fi

          source_url="https://${STORAGE_ACCOUNT_NAME}.blob.core.windows.net/opcenter-files"
          if [[ -n "$BLOB_SEED_PREFIX" ]]; then
            source_url="${source_url}/${BLOB_SEED_PREFIX}"
          fi

          echo "Copying from blob to file share…"
          azcopy copy \
            "${source_url}?${SOURCE_CONTAINER_SAS}" \
            "${dest_url}?${dest_sas}" \
            --recursive=true

      # ── AKS credentials ──────────────────────────────────────────────────
      - name: Configure AKS Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group "${{ needs.terraform_apply.outputs.resource_group_name }}" \
            --name           "${{ needs.terraform_apply.outputs.aks_cluster_name }}" \
            --overwrite-existing

      # ── SMB CSI driver ───────────────────────────────────────────────────
      - name: Install SMB CSI driver
        shell: bash
        run: |
          set -euo pipefail

          helm repo add csi-driver-smb \
            https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
          helm repo update

          helm upgrade --install csi-driver-smb csi-driver-smb/csi-driver-smb \
            --namespace kube-system \
            --version   v1.15.0 \
            --set       windows.enabled=true

          kubectl get csidriver smb.csi.k8s.io

      # ── Build Terraform-generated Helm values ─────────────────────────────
      - name: Create Terraform-generated Helm values
        shell: bash
        env:
          STORAGE_ACCOUNT_NAME: ${{ needs.terraform_apply.outputs.storage_account_name }}
          FILE_SHARE_NAME:      ${{ needs.terraform_apply.outputs.file_share_name }}
          SQL_SERVER_FQDN:      ${{ needs.terraform_apply.outputs.sql_server_fqdn }}
          SQL_DATABASE_NAME:    ${{ needs.terraform_apply.outputs.sql_database_name }}
          KV_NAME:              ${{ needs.terraform_apply.outputs.kv_name }}
          WINDOWS_ADMIN_USER:   ${{ vars.WINDOWS_ADMIN_USERNAME }}
          WINDOWS_ADMIN_PASS:   ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          # Retrieve SQL credentials from Key Vault (if provisioned),
          # otherwise fall back to the Windows admin credentials.
          if [[ -n "$KV_NAME" ]]; then
            sql_username="$(az keyvault secret show --vault-name "$KV_NAME" --name "opcenter-db-username" --query value -o tsv 2>/dev/null || echo "$WINDOWS_ADMIN_USER")"
            sql_password="$(az keyvault secret show --vault-name "$KV_NAME" --name "opcenter-db-password" --query value -o tsv 2>/dev/null || echo "$WINDOWS_ADMIN_PASS")"
          else
            sql_username="$WINDOWS_ADMIN_USER"
            sql_password="$WINDOWS_ADMIN_PASS"
          fi

          echo "::add-mask::$sql_password"
          echo "::add-mask::$WINDOWS_ADMIN_PASS"

          storage_key="$(az storage account keys list \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --query        '[0].value' \
            --output       tsv)"
          echo "::add-mask::$storage_key"

          cat > "$RUNNER_TEMP/terraform-generated-values.yaml" <<EOF
          database:
            host:     "$SQL_SERVER_FQDN"
            port:     1433
            username: "$sql_username"
            password: "$sql_password"
            schema:   "$SQL_DATABASE_NAME"
            name:     "$SQL_DATABASE_NAME"

          odsDatabase:
            host:     "$SQL_SERVER_FQDN"
            port:     1433
            username: "$sql_username"
            password: "$sql_password"
            schema:   "$SQL_DATABASE_NAME"
            name:     "$SQL_DATABASE_NAME"

          storage:
            fileShare: "//${STORAGE_ACCOUNT_NAME}.file.core.windows.net/${FILE_SHARE_NAME}"

          Fsx:
            createSecret: true
            username:     "Azure\\\\$WINDOWS_ADMIN_USER"
            password:     "$WINDOWS_ADMIN_PASS"
            domain:       ""

          azureFile:
            storageAccountName: "$STORAGE_ACCOUNT_NAME"
            storageAccountKey:  "$storage_key"
            shareName:          "$FILE_SHARE_NAME"
          EOF

      # ── Preserve existing metadata PVC ────────────────────────────────────
      - name: Preserve existing metadata PV and PVC
        id: preserve_storage
        shell: bash
        run: |
          set -euo pipefail

          pvc_backup="$RUNNER_TEMP/${OPCENTER_METADATA_PVC}.json"
          pv_backup="$RUNNER_TEMP/${OPCENTER_METADATA_PVC}-pv.json"

          if ! kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" >/dev/null 2>&1; then
            echo "PVC $OPCENTER_METADATA_PVC not found in $OPCENTER_NAMESPACE – fresh deploy."
            echo "preserved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pvc_phase="$(kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" \
            -o jsonpath='{.status.phase}')"
          if [[ "$pvc_phase" != "Bound" ]]; then
            echo "PVC $OPCENTER_METADATA_PVC is $pvc_phase, expected Bound."
            exit 1
          fi

          pv_name="$(kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" \
            -o jsonpath='{.spec.volumeName}')"

          kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o json \
            | jq 'del(
                .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"],
                .metadata.creationTimestamp,
                .metadata.resourceVersion,
                .metadata.uid,
                .metadata.managedFields,
                .metadata.finalizers,
                .metadata.ownerReferences,
                .status
              )' > "$pvc_backup"

          if [[ -n "$pv_name" ]]; then
            kubectl get pv "$pv_name" -o json \
              | jq 'del(
                  .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"],
                  .metadata.creationTimestamp,
                  .metadata.resourceVersion,
                  .metadata.uid,
                  .metadata.managedFields,
                  .metadata.finalizers,
                  .metadata.ownerReferences,
                  .spec.claimRef,
                  .status
                )' > "$pv_backup"
          fi

          echo "preserved=true"   >> "$GITHUB_OUTPUT"
          echo "pv_backup=$pv_backup"   >> "$GITHUB_OUTPUT"
          echo "pvc_backup=$pvc_backup" >> "$GITHUB_OUTPUT"

      # ── Uninstall existing releases (redeploy only) ───────────────────────
      - name: Uninstall existing releases
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'redeploy'
        shell: bash
        run: |
          set -euo pipefail

          release_names=(
            "opcenter-core"
            "opcenter-dbupdate"
            "opcenter-core-dbupdate"
            "dev-opcenter-config"
            "opcenter-core-shared"
            "opcenter-shared"
          )
          namespaces=(
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$SHARED_NAMESPACE"
            "$SHARED_NAMESPACE"
          )

          for i in "${!release_names[@]}"; do
            release="${release_names[$i]}"
            ns="${namespaces[$i]}"
            if helm status "$release" -n "$ns" >/dev/null 2>&1; then
              helm uninstall "$release" -n "$ns" --wait --timeout 10m
            else
              echo "Release $release not found in $ns – skipping."
            fi
          done

      # ── Restore PV / PVC after redeploy uninstall ────────────────────────
      - name: Restore existing metadata PV and PVC
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'redeploy'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.preserve_storage.outputs.preserved }}" != "true" ]]; then
            echo "No existing metadata PVC was preserved – cannot continue redeploy."
            exit 1
          fi

          pv_backup="${{ steps.preserve_storage.outputs.pv_backup }}"
          pvc_backup="${{ steps.preserve_storage.outputs.pvc_backup }}"

          if [[ -s "$pv_backup" ]]; then
            kubectl apply -f "$pv_backup"
          fi
          kubectl apply -f "$pvc_backup"

      # ── Deploy shared chart ───────────────────────────────────────────────
      - name: Deploy shared chart
        shell: bash
        run: |
          set -euo pipefail

          chart_dir="opcenter-core-shared"
          release_name="opcenter-shared"
          namespace="$SHARED_NAMESPACE"
          values_file="$chart_dir/updated-${chart_dir}-values.yaml"

          if [[ ! -f "$values_file" ]]; then
            values_file="$chart_dir/values.yaml"
          fi

          helm lint "$chart_dir" \
            --values "$values_file" \
            --values "$RUNNER_TEMP/terraform-generated-values.yaml"

          helm upgrade --install "$release_name" "$chart_dir" \
            -n "$namespace" \
            --create-namespace \
            --values "$values_file" \
            --values "$RUNNER_TEMP/terraform-generated-values.yaml"

      # ── Deploy application charts ─────────────────────────────────────────
      - name: Deploy application charts
        shell: bash
        run: |
          set -euo pipefail

          chart_dirs=(
            "opcenter-core-config"
            "opcenter-core-dbupdate"
            "opcenter-core"
          )
          release_names=(
            "dev-opcenter-config"
            "opcenter-core-dbupdate"
            "opcenter-core"
          )
          namespaces=(
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
          )

          for i in "${!chart_dirs[@]}"; do
            chart_dir="${chart_dirs[$i]}"
            release_name="${release_names[$i]}"
            namespace="${namespaces[$i]}"
            values_file="$chart_dir/updated-${chart_dir}-values.yaml"
            extra_values_args=(--values "$RUNNER_TEMP/terraform-generated-values.yaml")

            if [[ ! -f "$values_file" ]]; then
              values_file="$chart_dir/values.yaml"
            fi

            # Windows node selectors – only for opcenter-core
            if [[ "$chart_dir" == "opcenter-core" ]]; then
              windows_values_file="$RUNNER_TEMP/opcenter-core-azure-windows-node-selectors.yaml"
              cat > "$windows_values_file" <<EOF
          appServer:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          appServerSf:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          portal:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          notificationService:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          securityServices:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          inlinespc:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          EOF
              extra_values_args+=(--values "$windows_values_file")
            fi

            helm lint "$chart_dir" --values "$values_file" "${extra_values_args[@]}"

            helm upgrade --install "$release_name" "$chart_dir" \
              -n "$namespace" \
              --create-namespace \
              --values "$values_file" \
              "${extra_values_args[@]}"
          done

  # ─────────────────────────────────────────────────────────────
  # JOB 4 – Manual approval gate for destroy
  # ─────────────────────────────────────────────────────────────
  approve_destroy:
    name: Manual approval before destroy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy'
    environment:
      name: production-approval

    steps:
      - name: Approval granted
        run: echo "Approved to uninstall Helm releases and destroy Terraform resources."

  # ─────────────────────────────────────────────────────────────
  # JOB 5 – Helm uninstall + Terraform destroy
  # ─────────────────────────────────────────────────────────────
  destroy:
    name: Helm uninstall and Terraform destroy
    runs-on: ubuntu-latest
    needs: approve_destroy
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Prepare Terraform remote state
        shell: bash
        run: |
          set -euo pipefail

          az group create \
            --name    "$TF_STATE_RESOURCE_GROUP" \
            --location "South India" \
            --output none \
            2>/dev/null || true

          az storage account create \
            --name                "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group      "$TF_STATE_RESOURCE_GROUP" \
            --location            "South India" \
            --sku                 Standard_LRS \
            --kind                StorageV2 \
            --min-tls-version     TLS1_2 \
            --output none \
            2>/dev/null || true

          az storage container create \
            --name         "$TF_STATE_CONTAINER" \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --auth-mode    login \
            --output none \
            2>/dev/null || true

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}"

      - name: Configure AKS Kubernetes access
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cluster_name="$(terraform output -raw aks_cluster_name)"
          rg_name="$(terraform output -raw resource_group_name)"

          az aks get-credentials \
            --resource-group "$rg_name" \
            --name           "$cluster_name" \
            --overwrite-existing

      - name: Uninstall Helm releases
        shell: bash
        run: |
          set -euo pipefail

          helm uninstall opcenter-core         -n "$OPCENTER_NAMESPACE" --wait --timeout 10m || true
          helm uninstall opcenter-core-dbupdate -n "$OPCENTER_NAMESPACE" --wait --timeout 10m || true
          helm uninstall dev-opcenter-config    -n "$OPCENTER_NAMESPACE" --wait --timeout 10m || true
          helm uninstall opcenter-shared        -n "$SHARED_NAMESPACE"   --wait --timeout 10m || true

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_acr_name:               ${{ vars.ACR_NAME }}
          TF_VAR_storage_account_name:   ${{ vars.STORAGE_ACCOUNT_NAME }}
          TF_VAR_windows_admin_username: ${{ vars.WINDOWS_ADMIN_USERNAME }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
        run: terraform destroy -auto-approve