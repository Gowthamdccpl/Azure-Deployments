name: Deploy changed Helm charts

on:
  push:
    branches:
      - main
    paths:
      - "opcenter-core/**"
      - "opcenter-core-config/**"
      - "opcenter-core-dbupdate/**"
      - "opcenter-core-shared/**"
      - ".github/workflows/deploy-helm-charts.yml"

concurrency:
  group: helm-deploy-main
  cancel-in-progress: false

env:
  SHARED_NAMESPACE: shared
  OPCENTER_NAMESPACE: dev-opcenter
  WINDOWS_NODE_SELECTOR_KEY: kubernetes.azure.com/agentpool
  WINDOWS_NODE_SELECTOR_VALUE: win22

jobs:
  deploy:
    name: Deploy changed charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure Kubernetes access
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Detect changed charts
        id: changed-charts
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          chart_dirs=(
            "opcenter-core-shared"
            "opcenter-core-config"
            "opcenter-core-dbupdate"
            "opcenter-core"
          )

          changed_charts=()
          for chart_dir in "${chart_dirs[@]}"; do
            if grep -qE "^${chart_dir}/" <<< "$changed_files"; then
              changed_charts+=("$chart_dir")
            fi
          done

          {
            echo "charts<<EOF"
            printf "%s\n" "${changed_charts[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy changed charts
        if: steps.changed-charts.outputs.charts != ''
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r chart_dir; do
            [[ -z "$chart_dir" ]] && continue

            release_name="$(awk -F ': *' '$1 == "name" { print $2; exit }' "$chart_dir/Chart.yaml")"
            values_file="$chart_dir/values.yaml"
            namespace="$OPCENTER_NAMESPACE"
            extra_values_args=()

            if [[ "$chart_dir" == "opcenter-core-shared" ]]; then
              namespace="$SHARED_NAMESPACE"
              extra_values_args+=(--set storage.secret.accountkey="${{ secrets.ACCOUNTKEY }}")
            fi

            if [[ "$chart_dir" == "opcenter-core" ]]; then
              windows_values_file="$RUNNER_TEMP/opcenter-core-windows-node-selector.yaml"
              cat > "$windows_values_file" <<-EOF
              appServer:
                nodeSelectors:
                  "$WINDOWS_NODE_SELECTOR_KEY": "$WINDOWS_NODE_SELECTOR_VALUE"
              appServerSf:
                nodeSelectors:
                  "$WINDOWS_NODE_SELECTOR_KEY": "$WINDOWS_NODE_SELECTOR_VALUE"
              portal:
                nodeSelectors:
                  "$WINDOWS_NODE_SELECTOR_KEY": "$WINDOWS_NODE_SELECTOR_VALUE"
              notificationService:
                nodeSelectors:
                  "$WINDOWS_NODE_SELECTOR_KEY": "$WINDOWS_NODE_SELECTOR_VALUE"
              securityServices:
                nodeSelectors:
                  "$WINDOWS_NODE_SELECTOR_KEY": "$WINDOWS_NODE_SELECTOR_VALUE"
              inlinespc:
                nodeSelectors:
                  "$WINDOWS_NODE_SELECTOR_KEY": "$WINDOWS_NODE_SELECTOR_VALUE"
              EOF
              extra_values_args+=(--values "$windows_values_file")
            fi

            helm lint "$chart_dir"

            helm upgrade --install "$release_name" "$chart_dir" \
              --namespace "$namespace" \
              --create-namespace \
              --values "$values_file" \
              "${extra_values_args[@]}" \
              --wait \
              --timeout 10m
          done <<< "${{ steps.changed-charts.outputs.charts }}"

      - name: No chart changes
        if: steps.changed-charts.outputs.charts == ''
        run: echo "No Helm chart directory changes detected."
