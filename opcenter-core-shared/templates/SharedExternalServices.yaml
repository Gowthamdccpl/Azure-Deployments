{{- if .Values.database.host }}
# apiVersion: v1
# kind: Service
# metadata:
#   name: db
# spec:
#   ports:
#     - protocol: TCP
#       port: {{ .Values.database.port }}
#       targetPort: {{ .Values.database.port }}
---
# apiVersion: v1
# kind: Endpoints
# metadata:
#   name: db
# subsets:
#   - addresses:
#       - ip: {{ .Values.database.host }}
#     ports:
#       - port: {{ .Values.database.port }}


apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ExternalName
  externalName: {{ .Values.database.host }}
  ports:
    - port: {{ .Values.database.port }}
---
{{- end}}
{{- if .Values.licenseServer.host }}
apiVersion: v1
kind: Service
metadata:
  name: license-server
spec:
  ports:
    - protocol: TCP
      name: primary
      port: 28000
      targetPort: 28000
    - protocol: TCP
      name: ugslmd
      port: 28001
      targetPort: 28001
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: license-server
  labels:
    kubernetes.io/service-name: license-server
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.licenseServer.host | quote }}
ports:
  - port: 28000
    name: primary
    protocol: TCP
  - port: 28001
    name: ugslmd
    protocol: TCP
---
{{- end}}
{{- if .Values.ldapServer.host }}
apiVersion: v1
kind: Service
metadata:
  name: ldap-server
spec:
  ports:
    - protocol: TCP
      name: ldap
      port: 389
      targetPort: 389
    - protocol: TCP
      name: ldaps
      port: 636
      targetPort: 636
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ldap-server
  labels:
    kubernetes.io/service-name: ldap-server
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.ldapServer.host | quote }}
ports:
  - port: 389
    name: ldap
    protocol: TCP
  - port: 636
    name: ldaps
    protocol: TCP
{{- end}}
{{- if .Values.odsDatabase.port}}
{{- if .Values.odsDatabase.host }}
---
# apiVersion: v1
# kind: Service
# metadata:
#   name: ods-db
# spec:
#   ports:
#     - protocol: TCP
#       port: {{ .Values.odsDatabase.port }}
#       targetPort: {{ .Values.odsDatabase.port }}
# ---
# apiVersion: v1
# kind: Endpoints
# metadata:
#   name: ods-db
# subsets:
#   - addresses:
#       - ip: {{ .Values.odsDatabase.host }}
#     ports:
#       - port: {{ .Values.odsDatabase.port }}

apiVersion: v1
kind: Service
metadata:
  name: ods-db
spec:
  type: ExternalName
  externalName: {{ .Values.odsDatabase.host }}
  ports:
    - protocol: TCP
      port: {{ .Values.odsDatabase.port }}
      targetPort: {{ .Values.odsDatabase.port }}
---
{{- end}}
{{- end}}
{{- if .Values.saltLicenseServer.host }}
apiVersion: v1
kind: Service
metadata:
  name: salt-license-server
spec:
  ports:
    - protocol: TCP
      name: primary
      port: 29000
      targetPort: 29000
    - protocol: TCP
      name: saltd
      port: 29001
      targetPort: 29001
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: salt-license-server
  labels:
    kubernetes.io/service-name: salt-license-server
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.saltLicenseServer.host | quote }}
ports:
  - port: 29000
    name: primary
    protocol: TCP
  - port: 29001
    name: saltd
    protocol: TCP
---
{{- end}}
